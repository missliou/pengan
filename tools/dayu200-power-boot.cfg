{
  "jobs": [
    {
      "name": "param:pengan_power_boot",
      "condition": "bootevent.boot.completed=true",
      "cmds": ["start pengan_power_boot"]
    }
  ],
  "services": [
    {
      "name": "pengan_power_boot",
      "path": ["/system/bin/sh", "/system/etc/pengan-power.sh"],
      "uid": "root",
      "gid": ["root", "shell"],
      "once": 1,
      "ondemand": true,
      "secon": "u:r:su:s0",
      "permission": ["ohos.permission.POWER_MANAGER"]
    }
  ]
}
